name: Format REMEMBER design docs

on:
  pull_request:
    branches:
      - main

jobs:
  format-design-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format approved REMEMBER docs
        run: >-
          npx prettier --write
          docs/superpowers/specs/2026-08-25-remember-gamefeel-transitions-design.md
          docs/superpowers/plans/2026-08-25-remember-gamefeel-transitions.md
      - name: Upload formatted docs
        uses: actions/upload-artifact@v4
        with:
          name: remember-formatted-design-docs
          path: |
            docs/superpowers/specs/2026-08-25-remember-gamefeel-transitions-design.md
            docs/superpowers/plans/2026-08-25-remember-gamefeel-transitions.md
