name: Hero timeline tests

on:
  pull_request:
    branches:
      - main

jobs:
  timeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx --test src/components/experience/hero/hero-timeline-math.test.ts
