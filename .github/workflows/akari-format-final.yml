name: Format Akari final

on:
  push:
    branches:
      - feat/akari-editorial-chapter

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/akari-editorial-chapter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/components/experience/character-spotlight.tsx .github/workflows/akari-visual.yml src/app/akari-chapter-refinement.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/character-spotlight.tsx .github/workflows/akari-visual.yml src/app/akari-chapter-refinement.css
          git commit -m "style: format final Akari refinements"
          git push
