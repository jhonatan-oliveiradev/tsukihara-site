name: Format cinematic world polish

on:
  push:
    branches:
      - feat/cinematic-world-polish

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinematic-world-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: >-
          npx prettier --write
          src/app/immersive-polish.css
          src/app/layout.tsx
          src/components/experience/cinematic-preloader.tsx
          src/components/experience/hero-parallax-scene.tsx
          src/components/experience/immersive-experience.tsx
          src/components/experience/immersive-world.tsx
          src/content/game.ts
          src/content/immersive-copy.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/immersive-polish.css src/app/layout.tsx src/components/experience/cinematic-preloader.tsx src/components/experience/hero-parallax-scene.tsx src/components/experience/immersive-experience.tsx src/components/experience/immersive-world.tsx src/content/game.ts src/content/immersive-copy.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format cinematic world polish"
          git push origin HEAD:feat/cinematic-world-polish
