name: Format gameplay typography fix

on:
  push:
    branches:
      - fix/gameplay-typography-kanji

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gameplay-typography-kanji
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/app/gameplay-chapter.css src/content/gameplay-chapter.ts src/components/experience/gameplay-chapter.tsx src/components/experience/gameplay/use-gameplay-chapter-timeline.ts src/components/experience/jp-reveal-text.tsx src/app/gameplay-typography-fix.css src/app/layout.tsx .github/workflows/gameplay-chapter-visual.yml
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/gameplay-chapter.css src/content/gameplay-chapter.ts src/components/experience/gameplay-chapter.tsx src/components/experience/gameplay/use-gameplay-chapter-timeline.ts src/components/experience/jp-reveal-text.tsx src/app/gameplay-typography-fix.css src/app/layout.tsx .github/workflows/gameplay-chapter-visual.yml
          git commit -m "style: format gameplay typography fix"
          git push origin HEAD:fix/gameplay-typography-kanji
