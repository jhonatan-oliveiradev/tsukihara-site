name: Format Nine Realms map component

on:
  push:
    branches:
      - feat/nine-realms-world-map

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nine-realms-world-map
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/components/experience/nine-realms-map.tsx
      - name: Commit formatted component
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/nine-realms-map.tsx
          git commit -m "style: format Nine Realms map component"
          git push origin HEAD:feat/nine-realms-world-map

# Temporary workflow; removed after the formatter commit lands.
