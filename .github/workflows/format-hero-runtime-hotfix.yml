name: Format hero runtime hotfix

on:
  push:
    branches:
      - hotfix/hero-timeline-no-context

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/hero-timeline-no-context
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/components/experience/hero/hooks/use-hero-timeline.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/hero/hooks/use-hero-timeline.ts
          git commit -m "style: format context-free hero timeline"
          git push origin HEAD:hotfix/hero-timeline-no-context
