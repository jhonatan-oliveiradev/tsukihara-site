name: Format hero single file

on:
  push:
    branches:
      - feat/hero-eclipse-sequence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-eclipse-sequence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/components/experience/hero/tsukihara-hero.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/hero/tsukihara-hero.tsx
          git commit -m "style: normalize hero composition"
          git push origin HEAD:feat/hero-eclipse-sequence
