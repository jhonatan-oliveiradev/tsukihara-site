name: Visual cinematic QA

on:
  push:
    branches:
      - feat/cinematic-world-polish

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm start > /tmp/tsukihara-next.log 2>&1 &
          echo $! > /tmp/tsukihara-next.pid
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tsukihara-next.log
          exit 1
      - name: Capture visual states
        run: |
          mkdir -p qa-cinematic
          cat > /tmp/capture.cjs <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(450);
            await page.screenshot({ path: 'qa-cinematic/01-preloader.png', fullPage: false });
            await page.waitForFunction(() => !document.querySelector('.ix-preloader'), null, { timeout: 30000 });
            await page.waitForTimeout(450);
            await page.screenshot({ path: 'qa-cinematic/02-entry.png', fullPage: false });
            const silent = page.getByRole('button', { name: /silêncio|silence/i });
            await silent.click();
            await page.waitForTimeout(900);
            await page.screenshot({ path: 'qa-cinematic/03-hero.png', fullPage: false });
            await page.evaluate(() => window.scrollTo(0, window.innerHeight * 0.72));
            await page.waitForTimeout(900);
            await page.screenshot({ path: 'qa-cinematic/04-handoff.png', fullPage: false });
            await page.locator('#realms').scrollIntoViewIfNeeded();
            await page.waitForTimeout(850);
            await page.screenshot({ path: 'qa-cinematic/05-realms.png', fullPage: false });
            await page.locator('.ix-trailer').scrollIntoViewIfNeeded();
            await page.waitForTimeout(1100);
            await page.screenshot({ path: 'qa-cinematic/06-trailer.png', fullPage: false });
            await page.locator('#akari').scrollIntoViewIfNeeded();
            await page.waitForTimeout(850);
            await page.screenshot({ path: 'qa-cinematic/07-akari.png', fullPage: false });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node /tmp/capture.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-qa
          path: qa-cinematic/*.png
          if-no-files-found: error
