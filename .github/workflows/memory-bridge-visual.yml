name: Memory bridge visual QA

on:
  pull_request:
    branches:
      - main

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/tsukihara-memory.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tsukihara-memory.log
          exit 1
      - name: Capture memory bridge and Kintsugi handoff
        run: |
          mkdir -p qa/memory-bridge
          cat > qa/memory-bridge.cjs <<'NODE'
          const { chromium } = require('playwright');

          async function enter(page) {
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(
              () => document.querySelector('.ix-entry-gateway')?.dataset.phase === 'entry',
              null,
              { timeout: 45000 },
            );
            const buttons = page.locator('.ix-gateway-actions button');
            await buttons.nth(1).evaluate((button) => button.click());
            await page.waitForFunction(() => !document.querySelector('.ix-entry-gateway'), null, {
              timeout: 12000,
            });
            await page.waitForSelector('#top', { timeout: 10000 });
            await page.waitForTimeout(700);
          }

          async function readState(page) {
            return page.evaluate(() => {
              const bridge = document.querySelector('[data-memory-bridge]');
              const temple = document.querySelector('[data-memory-temple]');
              const veil = document.querySelector('[data-kintsugi-entry-veil]');
              const kintsugi = document.querySelector('#gate');
              const bridgeStyle = bridge ? getComputedStyle(bridge) : null;
              const templeStyle = temple ? getComputedStyle(temple) : null;
              const veilStyle = veil ? getComputedStyle(veil) : null;
              const kintsugiRect = kintsugi?.getBoundingClientRect();

              return {
                bridgeOpacity: bridgeStyle ? Number(bridgeStyle.opacity) : null,
                bridgeVisibility: bridgeStyle?.visibility ?? null,
                templeOpacity: templeStyle ? Number(templeStyle.opacity) : null,
                veilOpacity: veilStyle ? Number(veilStyle.opacity) : null,
                veilHeight: veil?.getBoundingClientRect().height ?? null,
                kintsugiTop: kintsugiRect?.top ?? null,
                overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
              };
            });
          }

          async function capture(browser, width, height, label) {
            const page = await browser.newPage({ viewport: { width, height } });
            const errors = [];
            page.on('pageerror', (error) => errors.push(`pageerror: ${error.message}`));
            page.on('console', (message) => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });
            await enter(page);

            const hero = page.locator('#top');
            const top = await hero.evaluate((el) => el.getBoundingClientRect().top + window.scrollY);
            const heroHeight = await hero.evaluate((el) => el.getBoundingClientRect().height);
            const travel = Math.max(1, heroHeight - height);

            for (const fraction of [0.82, 0.9, 0.97]) {
              await page.evaluate(({ y }) => window.scrollTo({ top: y, behavior: 'instant' }), {
                y: top + travel * fraction,
              });
              await page.waitForTimeout(850);
              const state = await readState(page);
              if (state.overflow) errors.push(`horizontal overflow at ${label} bridge ${fraction}`);
              console.log(label, 'bridge', fraction, state);
              await page.screenshot({
                path: `qa/memory-bridge/${label}-bridge-${String(fraction).replace('.', '-')}.png`,
                fullPage: false,
              });
            }

            for (const release of [0.12, 0.52, 0.88]) {
              await page.evaluate(({ y }) => window.scrollTo({ top: y, behavior: 'instant' }), {
                y: top + travel + height * release,
              });
              await page.waitForTimeout(850);
              const state = await readState(page);

              if (state.overflow) errors.push(`horizontal overflow at ${label} handoff ${release}`);
              if (state.templeOpacity === null || state.templeOpacity > 0.06) {
                errors.push(
                  `bridge temple still readable at ${label} handoff ${release}: ${state.templeOpacity}`,
                );
              }
              if (state.veilOpacity === null || state.veilOpacity < 0.95 || !state.veilHeight) {
                errors.push(
                  `Kintsugi entry veil missing at ${label} handoff ${release}: ${JSON.stringify(state)}`,
                );
              }
              if (state.kintsugiTop === null || state.kintsugiTop >= height) {
                errors.push(
                  `Kintsugi did not enter viewport at ${label} handoff ${release}: ${state.kintsugiTop}`,
                );
              }

              console.log(label, 'handoff', release, state);
              await page.screenshot({
                path: `qa/memory-bridge/${label}-handoff-${String(release).replace('.', '-')}.png`,
                fullPage: false,
              });
            }

            if (errors.length) throw new Error(errors.join('\n'));
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await capture(browser, 390, 844, 'mobile');
            await capture(browser, 768, 1024, 'tablet');
            await capture(browser, 1440, 900, 'desktop');
            await capture(browser, 1920, 1080, 'fullhd');
            await capture(browser, 2560, 1080, 'ultrawide');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node qa/memory-bridge.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memory-bridge-visual
          path: qa/memory-bridge
