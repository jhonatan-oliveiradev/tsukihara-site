name: Format Akari mosaic

on:
  push:
    branches:
      - feat/akari-mosaic-details

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/akari-mosaic-details
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/app/akari-mosaic.css src/components/experience/character-spotlight.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/akari-mosaic.css src/components/experience/character-spotlight.tsx
          git commit -m "style: format Akari mosaic sources"
          git push
