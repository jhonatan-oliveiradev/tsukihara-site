name: Hero runtime smoke

on:
  pull_request:
    branches:
      - main

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format hero files for review
        run: |
          npx prettier --write src/app/hero-eclipse-sequence.css src/components/experience/hero/hooks/use-hero-timeline.ts src/components/experience/hero/tsukihara-hero.tsx
          mkdir -p qa/formatted/src/app qa/formatted/src/components/experience/hero/hooks qa/formatted/src/components/experience/hero
          cp src/app/hero-eclipse-sequence.css qa/formatted/src/app/
          cp src/components/experience/hero/hooks/use-hero-timeline.ts qa/formatted/src/components/experience/hero/hooks/
          cp src/components/experience/hero/tsukihara-hero.tsx qa/formatted/src/components/experience/hero/
      - uses: actions/upload-artifact@v4
        with:
          name: hero-formatted-files
          path: qa/formatted
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/tsukihara-runtime.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tsukihara-runtime.log
          exit 1
      - name: Exercise and capture hero runtime
        run: |
          mkdir -p qa/screens
          cat > qa/runtime-smoke.cjs <<'NODE'
          const { chromium } = require('playwright');

          async function enter(page) {
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('.ix-entry', { timeout: 45000 });
            const buttons = page.locator('.ix-entry-actions button');
            if (await buttons.count() > 1) await buttons.nth(1).click();
            await page.waitForFunction(() => !document.querySelector('.ix-entry'), null, { timeout: 15000 });
            await page.waitForSelector('.th-hero', { timeout: 10000 });
            await page.waitForTimeout(700);
          }

          async function captureSequence(browser, width, height, label, fractions) {
            const page = await browser.newPage({ viewport: { width, height } });
            const failures = [];
            page.on('pageerror', (error) => failures.push(`pageerror: ${error.message}`));
            page.on('console', (message) => {
              const text = message.text();
              if (/Invalid scope|Cannot access 'ctx' before initialization|Maximum call stack size exceeded/i.test(text)) {
                failures.push(`console: ${text}`);
              }
            });

            await enter(page);
            const hero = page.locator('.th-hero');
            const top = await hero.evaluate((el) => el.getBoundingClientRect().top + window.scrollY);
            const distance = height * (width <= 680 ? 2.08 : width <= 980 ? 2.55 : 3.05);

            for (const fraction of fractions) {
              await page.evaluate(({ y }) => window.scrollTo({ top: y, behavior: 'instant' }), { y: top + distance * fraction });
              await page.waitForTimeout(1200);
              const progress = await hero.getAttribute('data-hero-progress');
              const overflow = await page.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
              if (overflow) failures.push(`horizontal overflow at ${label} ${fraction}`);
              await page.screenshot({ path: `qa/screens/${label}-${String(fraction).replace('.', '-')}-${progress ?? 'na'}.png`, fullPage: false });
            }

            if (failures.length) throw new Error(failures.join('\n'));
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await captureSequence(browser, 1440, 900, 'desktop', [0, 0.18, 0.4, 0.58, 0.76, 0.94]);
            await captureSequence(browser, 1920, 1080, 'desktop-xl', [0, 0.58, 0.94]);
            await captureSequence(browser, 2560, 1080, 'ultrawide', [0, 0.58, 0.94]);
            await captureSequence(browser, 768, 1024, 'tablet', [0, 0.58, 0.94]);
            await captureSequence(browser, 390, 844, 'mobile', [0, 0.58, 0.94]);
            console.log('Hero runtime and visual capture completed without targeted runtime errors or overflow.');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node qa/runtime-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-visual-qa
          path: qa/screens
