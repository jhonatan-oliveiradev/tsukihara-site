name: REMEMBER Task 1 formatter

on:
  push:
    branches:
      - feat/remember-prologue-expansion
    paths:
      - ".github/workflows/remember-format-task1.yml"
      - "src/components/remember/content/memory-definitions.test.mjs"
      - "src/components/remember/content/memory-definitions.ts"
      - "src/components/remember/state/remember-reducer.ts"
      - "src/components/remember/state/remember-save.test.mjs"
      - "src/components/remember/state/remember-save.ts"
      - "src/components/remember/state/remember-state.ts"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remember-prologue-expansion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format Task 1 files
        run: |
          npx prettier --write \
            src/components/remember/content/memory-definitions.test.mjs \
            src/components/remember/content/memory-definitions.ts \
            src/components/remember/state/remember-reducer.ts \
            src/components/remember/state/remember-save.test.mjs \
            src/components/remember/state/remember-save.ts \
            src/components/remember/state/remember-state.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/remember/content/memory-definitions.test.mjs \
            src/components/remember/content/memory-definitions.ts \
            src/components/remember/state/remember-reducer.ts \
            src/components/remember/state/remember-save.test.mjs \
            src/components/remember/state/remember-save.ts \
            src/components/remember/state/remember-state.ts
          git commit -m "style: format REMEMBER task 1 files"
          git push origin HEAD:feat/remember-prologue-expansion
