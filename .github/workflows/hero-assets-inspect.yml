name: Hero asset inspection

on:
  pull_request:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Inspect hero PNG assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          rows = ["# Hero asset report", "", "| Asset | Width | Height | Ratio | Mode | Alpha | Bytes |", "|---|---:|---:|---:|---|---|---:|"]
          for path in sorted(Path("public/hero-elements").glob("*.png")):
              with Image.open(path) as im:
                  width, height = im.size
                  has_alpha = "A" in im.getbands() or "transparency" in im.info
                  rows.append(f"| `{path.name}` | {width} | {height} | {width / height:.4f} | {im.mode} | {'yes' if has_alpha else 'no'} | {path.stat().st_size} |")
          report = "\n".join(rows) + "\n"
          Path("hero-assets-report.md").write_text(report, encoding="utf-8")
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hero-assets-report
          path: hero-assets-report.md
          retention-days: 3
