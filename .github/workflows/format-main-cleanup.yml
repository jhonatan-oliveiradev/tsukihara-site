name: Format main cleanup

on:
  push:
    branches:
      - feat/cinematic-world-polish-main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinematic-world-polish-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/app/layout.tsx src/components/experience/hero-parallax-scene.tsx
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/layout.tsx src/components/experience/hero-parallax-scene.tsx
          git commit -m "style: format main-based cinematic cleanup"
          git push origin HEAD:feat/cinematic-world-polish-main
