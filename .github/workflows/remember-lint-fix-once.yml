name: Temporary REMEMBER lint fixer

on:
  push:
    branches:
      - fix/remember-publish-ready-final
    paths:
      - .github/workflows/remember-lint-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/remember-publish-ready-final

      - name: Apply deterministic lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          puzzle = Path("src/components/remember/restore/memory-puzzle.tsx")
          text = puzzle.read_text()
          reset_effect = '''  useEffect(() => {
            focusStateRef.current = READY_FOCUS;
            realityCycleRef.current = INITIAL_REALITY;
            setFocusState(READY_FOCUS);
            setCurrentReality("a");
          }, [memory.id]);

          '''
          assert reset_effect in text, "expected redundant Gekkai reset effect was not found"
          puzzle.write_text(text.replace(reset_effect, "", 1))

          interlude = Path("src/components/remember/interludes/interlude-01-scene.tsx")
          text = interlude.read_text()
          old_import = 'import { useState, type CSSProperties, type FocusEvent, type PointerEvent } from "react";'
          new_import = 'import { useState, type CSSProperties } from "react";'
          assert old_import in text, "expected React type import was not found"
          text = text.replace(old_import, new_import, 1)

          old_handlers = '''  const handlePointerEnter =
            (traceId: Interlude01TraceId) => (_event: PointerEvent<HTMLButtonElement>) => {
              if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) discover(traceId);
            };

          const handleFocus = (traceId: Interlude01TraceId) => (_event: FocusEvent<HTMLButtonElement>) => {
            discover(traceId);
          };
          '''
          new_handlers = '''  const handlePointerEnter = (traceId: Interlude01TraceId) => () => {
            if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) discover(traceId);
          };

          const handleFocus = (traceId: Interlude01TraceId) => () => {
            discover(traceId);
          };
          '''
          assert old_handlers in text, "expected Interlude I handlers were not found"
          interlude.write_text(text.replace(old_handlers, new_handlers, 1))
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format touched files
        run: >-
          npx prettier --write
          src/components/remember/restore/memory-puzzle.tsx
          src/components/remember/interludes/interlude-01-scene.tsx

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/remember/restore/memory-puzzle.tsx \
            src/components/remember/interludes/interlude-01-scene.tsx
          git commit -m "fix: remove redundant REMEMBER state reset"
          git push origin HEAD:fix/remember-publish-ready-final
