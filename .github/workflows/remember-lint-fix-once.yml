name: Temporary REMEMBER lint fixer

on:
  push:
    branches:
      - fix/remember-publish-ready-final
    paths:
      - .github/workflows/remember-lint-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/remember-publish-ready-final

      - name: Apply deterministic lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          puzzle = Path("src/components/remember/restore/memory-puzzle.tsx")
          text = puzzle.read_text()
          reset_pattern = re.compile(
              r'\n\s*useEffect\(\(\) => \{\s*'
              r'focusStateRef\.current = READY_FOCUS;\s*'
              r'realityCycleRef\.current = INITIAL_REALITY;\s*'
              r'setFocusState\(READY_FOCUS\);\s*'
              r'setCurrentReality\("a"\);\s*'
              r'\}, \[memory\.id\]\);\s*\n',
              re.MULTILINE,
          )
          text, reset_count = reset_pattern.subn("\n", text, count=1)
          assert reset_count == 1, f"expected one redundant Gekkai reset effect, removed {reset_count}"
          puzzle.write_text(text)

          interlude = Path("src/components/remember/interludes/interlude-01-scene.tsx")
          text = interlude.read_text()
          old_import = 'import { useState, type CSSProperties, type FocusEvent, type PointerEvent } from "react";'
          new_import = 'import { useState, type CSSProperties } from "react";'
          assert text.count(old_import) == 1, "expected one React type import"
          text = text.replace(old_import, new_import, 1)

          pointer_pattern = re.compile(
              r'\s*const handlePointerEnter =\s*'
              r'\(traceId: Interlude01TraceId\) => \(_event: PointerEvent<HTMLButtonElement>\) => \{\s*'
              r'if \(window\.matchMedia\("\(hover: hover\) and \(pointer: fine\)"\)\.matches\) discover\(traceId\);\s*'
              r'\};'
          )
          pointer_replacement = '''
          const handlePointerEnter = (traceId: Interlude01TraceId) => () => {
            if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) discover(traceId);
          };'''
          text, pointer_count = pointer_pattern.subn(pointer_replacement, text, count=1)
          assert pointer_count == 1, f"expected one pointer handler, replaced {pointer_count}"

          focus_pattern = re.compile(
              r'\s*const handleFocus = \(traceId: Interlude01TraceId\) => \(_event: FocusEvent<HTMLButtonElement>\) => \{\s*'
              r'discover\(traceId\);\s*'
              r'\};'
          )
          focus_replacement = '''
          const handleFocus = (traceId: Interlude01TraceId) => () => {
            discover(traceId);
          };'''
          text, focus_count = focus_pattern.subn(focus_replacement, text, count=1)
          assert focus_count == 1, f"expected one focus handler, replaced {focus_count}"
          interlude.write_text(text)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format touched files
        run: >-
          npx prettier --write
          src/components/remember/restore/memory-puzzle.tsx
          src/components/remember/interludes/interlude-01-scene.tsx

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/remember/restore/memory-puzzle.tsx \
            src/components/remember/interludes/interlude-01-scene.tsx
          git commit -m "fix: remove redundant REMEMBER state reset"
          git push origin HEAD:fix/remember-publish-ready-final
