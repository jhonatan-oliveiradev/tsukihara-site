name: Format world map inspector motion

on:
  push:
    branches:
      - fix/world-map-inspector-motion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/world-map-inspector-motion
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/components/experience/nine-realms-map.tsx
      - name: Commit formatted component
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/nine-realms-map.tsx
          git commit -m "style: format world map inspector motion"
          git push origin HEAD:fix/world-map-inspector-motion
