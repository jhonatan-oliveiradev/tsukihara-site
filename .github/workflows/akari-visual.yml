name: Akari chapter visual QA

on:
  pull_request:
    branches:
      - main

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/tsukihara-akari.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tsukihara-akari.log
          exit 1
      - name: Capture Akari chapter
        run: |
          mkdir -p qa/akari
          cat > qa/akari.cjs <<'NODE'
          const { chromium } = require('playwright');

          async function enter(page) {
            await page.goto('http://127.0.0.1:3000', { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(
              () => document.querySelector('.ix-entry-gateway')?.dataset.phase === 'entry',
              null,
              { timeout: 45000 },
            );
            const buttons = page.locator('.ix-gateway-actions button');
            await buttons.nth(1).evaluate((button) => button.click());
            await page.waitForFunction(() => !document.querySelector('.ix-entry-gateway'), null, {
              timeout: 12000,
            });
            await page.waitForSelector('#akari', { timeout: 10000 });
            await page.waitForTimeout(600);
          }

          async function capture(browser, width, height, label) {
            const page = await browser.newPage({ viewport: { width, height } });
            const errors = [];
            page.on('pageerror', (error) => errors.push(error.message));
            await enter(page);

            const section = page.locator('#akari');
            const sectionTop = await section.evaluate(
              (element) => element.getBoundingClientRect().top + window.scrollY,
            );

            await page.evaluate(({ y }) => window.scrollTo({ top: y, behavior: 'instant' }), {
              y: sectionTop + 40,
            });
            await page.waitForTimeout(500);

            const intro = await page.evaluate(() => {
              const headline = document.querySelector('.akari-intro h2');
              const headlineBox = headline?.getBoundingClientRect();
              return {
                overflow:
                  document.documentElement.scrollWidth >
                  document.documentElement.clientWidth + 1,
                headlineText: headline?.textContent?.trim() ?? '',
                headlineHeight: headlineBox?.height ?? 0,
              };
            });

            if (intro.overflow) errors.push(`horizontal overflow in Akari intro at ${label}`);
            if (!intro.headlineText.includes('Lua') && !intro.headlineText.includes('Moon')) {
              errors.push(`unexpected Akari headline at ${label}: ${intro.headlineText}`);
            }
            if (intro.headlineHeight > height * 0.68) {
              errors.push(`Akari headline is too tall at ${label}: ${intro.headlineHeight}/${height}`);
            }

            await page.screenshot({ path: `qa/akari/${label}-intro.png`, fullPage: false });

            const details = page.locator('[data-akari-details-stage]');
            const detailsTop = await details.evaluate(
              (element) => element.getBoundingClientRect().top + window.scrollY,
            );
            const detailsHeight = await details.evaluate(
              (element) => element.getBoundingClientRect().height,
            );
            const travel = Math.max(1, detailsHeight - height);
            const fractions = [0.02, 0.17, 0.32, 0.47, 0.62, 0.77, 0.96];

            for (const fraction of fractions) {
              await page.evaluate(({ y }) => window.scrollTo({ top: y, behavior: 'instant' }), {
                y: detailsTop + travel * fraction,
              });
              await page.waitForTimeout(800);

              const state = await page.evaluate(() => {
                const board = document.querySelector('[data-akari-mosaic-board]');
                const boardBox = board?.getBoundingClientRect();
                const activeItems = document.querySelectorAll(
                  '[data-akari-detail-item].is-active:not([hidden])',
                ).length;
                const visibleItems = Array.from(
                  document.querySelectorAll('[data-akari-detail-item]'),
                ).filter((element) => {
                  const style = getComputedStyle(element);
                  return !element.hidden && style.display !== 'none' && Number(style.opacity) > 0.05;
                }).length;

                return {
                  overflow:
                    document.documentElement.scrollWidth >
                    document.documentElement.clientWidth + 1,
                  boardVisible:
                    Boolean(boardBox) &&
                    boardBox.width > 80 &&
                    boardBox.height > 80 &&
                    boardBox.bottom > 0 &&
                    boardBox.top < window.innerHeight,
                  revealedTiles: document.querySelectorAll(
                    '[data-akari-mosaic-tile].is-revealed',
                  ).length,
                  currentTiles: document.querySelectorAll(
                    '[data-akari-mosaic-tile].is-current',
                  ).length,
                  activeItems,
                  visibleItems,
                  figureRevealed: document
                    .querySelector('[data-akari-mosaic-figure]')
                    ?.classList.contains('is-revealed'),
                };
              });

              const phase = Math.min(6, Math.floor(fraction * 7));
              const expectedTiles = Math.min(6, phase + 1);
              const expectedComplete = phase >= 6;

              if (state.overflow) errors.push(`horizontal overflow at ${label} ${fraction}`);
              if (!state.boardVisible) errors.push(`mosaic board left viewport at ${label} ${fraction}`);
              if (state.revealedTiles !== expectedTiles) {
                errors.push(
                  `unexpected tile assembly at ${label} ${fraction}: expected ${expectedTiles}, got ${state.revealedTiles}`,
                );
              }
              if (state.activeItems !== 1 || state.visibleItems !== 1) {
                errors.push(`invalid narrative state at ${label} ${fraction}: ${JSON.stringify(state)}`);
              }
              if (!expectedComplete && state.currentTiles !== 1) {
                errors.push(`missing current tile at ${label} ${fraction}: ${JSON.stringify(state)}`);
              }
              if (expectedComplete && state.currentTiles !== 0) {
                errors.push(`current tile remains after completion at ${label}: ${JSON.stringify(state)}`);
              }
              if (Boolean(state.figureRevealed) !== expectedComplete) {
                errors.push(`invalid full-figure reveal at ${label} ${fraction}: ${JSON.stringify(state)}`);
              }

              await page.screenshot({
                path: `qa/akari/${label}-mosaic-${String(fraction).replace('.', '-')}.png`,
                fullPage: false,
              });
            }

            if (errors.length) throw new Error(errors.join('\n'));
            await page.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await capture(browser, 390, 844, 'mobile');
            await capture(browser, 768, 1024, 'tablet');
            await capture(browser, 1440, 900, 'desktop');
            await capture(browser, 1920, 1080, 'wide');
            await capture(browser, 2560, 1080, 'ultrawide');
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node qa/akari.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akari-chapter-visual
          path: qa/akari
