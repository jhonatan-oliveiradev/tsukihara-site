name: REMEMBER format artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format REMEMBER files
        run: >-
          npx prettier --write
          docs/superpowers/plans/2026-08-24-tsukihara-remember-foundation.md
          docs/superpowers/specs/2026-08-24-tsukihara-remember-design.md
          src/app/remember/remember-refinement.css
          src/app/remember/remember.css
          src/components/remember/remember-experience.tsx
          src/components/remember/restore/kintsugi-seams.tsx
          src/components/remember/restore/memory-fragment.tsx
          src/components/remember/scenes/entry-scene.tsx
          src/components/remember/scenes/memory-reveal-scene.tsx
          src/components/remember/scenes/restore-scene.tsx
      - name: Package formatted files
        run: |
          mkdir -p /tmp/remember-formatted
          cp --parents \
            docs/superpowers/plans/2026-08-24-tsukihara-remember-foundation.md \
            docs/superpowers/specs/2026-08-24-tsukihara-remember-design.md \
            src/app/remember/remember-refinement.css \
            src/app/remember/remember.css \
            src/components/remember/remember-experience.tsx \
            src/components/remember/restore/kintsugi-seams.tsx \
            src/components/remember/restore/memory-fragment.tsx \
            src/components/remember/scenes/entry-scene.tsx \
            src/components/remember/scenes/memory-reveal-scene.tsx \
            src/components/remember/scenes/restore-scene.tsx \
            /tmp/remember-formatted/
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: remember-formatted
          path: /tmp/remember-formatted
          retention-days: 1
