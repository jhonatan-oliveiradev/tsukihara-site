name: Temporary REMEMBER retry credits implementation
# retry after extending the analytics event contract

on:
  push:
    branches:
      - feat/remember-memory-retry-credits
    paths:
      - .github/workflows/remember-retry-credits-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/remember-memory-retry-credits

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply approved patch
        run: python .github/remember_retry_credits_patch.py

      - name: Format changed files
        run: npx prettier --write src/components/remember/remember-experience.tsx src/components/remember/scenes/restore-scene.tsx src/components/remember/content/remember-locales.ts src/components/remember/scenes/credits-scene.tsx src/app/remember/remember-results.css src/app/remember/remember-cinematic.css

      - name: Test REMEMBER
        run: npm run test:remember

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/remember/remember-experience.tsx src/components/remember/scenes/restore-scene.tsx src/components/remember/content/remember-locales.ts src/components/remember/scenes/credits-scene.tsx src/app/remember/remember-results.css src/app/remember/remember-cinematic.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: add memory retry and creator credits"
          git push origin HEAD:feat/remember-memory-retry-credits
