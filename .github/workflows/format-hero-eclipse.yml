name: Format hero eclipse

on:
  push:
    branches:
      - feat/hero-eclipse-sequence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-eclipse-sequence
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Format hero files
        run: |
          npx prettier --write \
            docs/superpowers/specs/2026-08-21-hero-eclipse-sequence-design.md \
            docs/superpowers/plans/2026-08-21-hero-eclipse-sequence.md \
            docs/superpowers/hero-assets-report.md \
            src/app/hero-eclipse-sequence.css \
            src/app/layout.tsx \
            src/components/experience/cinematic-hero.tsx \
            src/components/experience/immersive-experience.tsx \
            src/components/experience/hero/**/*.ts \
            src/components/experience/hero/**/*.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src
          git commit -m "style: format eclipse hero"
          git push origin HEAD:feat/hero-eclipse-sequence
