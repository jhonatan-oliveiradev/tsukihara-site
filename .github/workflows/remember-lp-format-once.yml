name: Temporary REMEMBER LP formatter

on:
  push:
    branches:
      - feat/remember-lp-entry
    paths:
      - .github/workflows/remember-lp-format-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/remember-lp-entry

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format REMEMBER LP files
        run: >-
          npx prettier --write
          src/app/remember-gateway.css
          src/components/experience/immersive-experience.tsx

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/remember-gateway.css \
            src/components/experience/immersive-experience.tsx
          git commit -m "style: format REMEMBER landing entry"
          git push origin HEAD:feat/remember-lp-entry
