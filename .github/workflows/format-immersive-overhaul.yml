name: Format immersive overhaul

on:
  push:
    branches:
      - feat/immersive-overhaul-main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/immersive-overhaul-main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - name: Commit formatted sources and lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs src package.json
          git commit -m "style: format immersive overhaul"
          git push origin HEAD:feat/immersive-overhaul-main
