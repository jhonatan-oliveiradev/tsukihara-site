name: REMEMBER format probe

on:
  pull_request:
    paths:
      - "src/components/remember/**"
      - "src/app/remember/**"
      - ".github/workflows/remember-format-probe.yml"

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Print canonical REMEMBER formatting diff
        run: |
          npx prettier --write "src/components/remember/**/*.{ts,tsx,mjs}" "src/app/remember/*.css"
          git diff -- src/components/remember src/app/remember
          exit 1
