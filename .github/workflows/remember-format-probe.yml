name: REMEMBER format probe

on:
  pull_request:
    paths:
      - "src/components/remember/restore/memory-restoration-effect.tsx"
      - ".github/workflows/remember-format-probe.yml"

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Print canonical formatting diff
        run: |
          npx prettier --write src/components/remember/restore/memory-restoration-effect.tsx
          git diff -- src/components/remember/restore/memory-restoration-effect.tsx
          exit 1
