name: Format immersive JP polish

on:
  push:
    branches:
      - feat/immersive-jp-motion-copy

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/immersive-jp-motion-copy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/components/experience/immersive-experience.tsx src/content/immersive-copy.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/immersive-experience.tsx src/content/immersive-copy.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git commit -m "style: format immersive motion and copy"
          git push origin HEAD:feat/immersive-jp-motion-copy
