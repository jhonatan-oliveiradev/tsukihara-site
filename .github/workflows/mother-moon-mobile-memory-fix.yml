name: Mother Moon mobile memory fix

on:
  push:
    branches:
      - feat/mother-moon-eclipse-heir

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mother-moon-eclipse-heir
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Keep passive memories on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/mother-moon-chapter.css')
          text = path.read_text()
          old = '''  .ix-mm-memory-field {\n    display: none;\n  }'''
          new = '''  .ix-mm-memory-field {\n    display: block;\n    height: 50svh;\n    inset-inline: 0.75rem;\n  }\n\n  .ix-mm-memory--phrase {\n    width: min(15rem, 68vw);\n    font-size: 0.88rem;\n  }'''
          if old not in text:
              raise SystemExit('mobile memory rule not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write src/app/mother-moon-chapter.css
      - name: Remove temporary workflow
        run: rm .github/workflows/mother-moon-mobile-memory-fix.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/mother-moon-chapter.css .github/workflows/mother-moon-mobile-memory-fix.yml
          git commit -m "fix: preserve passive mother moon memories on mobile"
          git push origin HEAD:feat/mother-moon-eclipse-heir
