name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Apply REMEMBER Task 1 formatting
        if: github.event_name == 'pull_request'
        run: |
          npx prettier --write \
            src/components/remember/content/memory-definitions.test.mjs \
            src/components/remember/content/memory-definitions.ts \
            src/components/remember/state/remember-reducer.ts \
            src/components/remember/state/remember-save.test.mjs \
            src/components/remember/state/remember-save.ts \
            src/components/remember/state/remember-state.ts
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/remember/content/memory-definitions.test.mjs \
            src/components/remember/content/memory-definitions.ts \
            src/components/remember/state/remember-reducer.ts \
            src/components/remember/state/remember-save.test.mjs \
            src/components/remember/state/remember-save.ts \
            src/components/remember/state/remember-state.ts
          git commit -m "style: format REMEMBER task 1 files"
          git push origin HEAD:${{ github.head_ref }}
      - name: Hero timeline regression
        run: npm run test:hero
      - name: REMEMBER regression
        run: npm run test:remember
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
