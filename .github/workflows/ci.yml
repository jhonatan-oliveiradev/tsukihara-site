name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Hero timeline regression
        run: npm run test:hero
      - name: Check formatting
        id: formatting
        continue-on-error: true
        run: npm run format:check
      - name: Capture formatting fixes
        if: steps.formatting.outcome == 'failure'
        run: |
          npm run format
          mkdir -p /tmp/prettier-fixes
          git diff --name-only -z | while IFS= read -r -d '' file; do
            mkdir -p "/tmp/prettier-fixes/$(dirname "$file")"
            cp "$file" "/tmp/prettier-fixes/$file"
          done
      - name: Upload formatting fixes
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: prettier-fixes
          path: /tmp/prettier-fixes
          if-no-files-found: error
          retention-days: 1
      - name: Fail formatting gate
        if: steps.formatting.outcome == 'failure'
        run: exit 1
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
