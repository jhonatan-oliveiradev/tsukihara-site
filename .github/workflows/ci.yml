name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check formatting
        run: |
          npm run format:check || {
            npx prettier --write src/components/experience/mother-moon/use-mother-moon-fragment-drag.ts
            git diff -- src/components/experience/mother-moon/use-mother-moon-fragment-drag.ts
            exit 1
          }
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build