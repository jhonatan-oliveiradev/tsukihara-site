name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format forbidden records files
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/bestiary-bosses-forbidden-records'
        run: |
          npx prettier --write \
            docs/superpowers/plans/2026-08-23-bestiary-bosses-forbidden-records.md \
            docs/superpowers/specs/2026-08-23-bestiary-bosses-forbidden-records-design.md \
            src/app/bestiary-bosses.css \
            src/components/experience/bestiary-bosses-chapter.tsx \
            src/content/bestiary.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/superpowers/plans/2026-08-23-bestiary-bosses-forbidden-records.md docs/superpowers/specs/2026-08-23-bestiary-bosses-forbidden-records-design.md src/app/bestiary-bosses.css src/components/experience/bestiary-bosses-chapter.tsx src/content/bestiary.ts
            git commit -m "style: format forbidden records chapter"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
