name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Hero timeline regression
        run: npm run test:hero
      - name: REMEMBER regression
        run: npm run test:remember
      - name: Canonical Task 3 formatting
        run: |
          npx prettier --write \
            package.json \
            src/app/remember/remember-game.css \
            src/components/remember/archive/archive-policy.ts \
            src/components/remember/archive/archive-policy.test.mjs \
            src/components/remember/archive/memory-archive.tsx \
            src/components/remember/audio/use-remember-audio.ts \
            src/components/remember/content/remember-locales.ts \
            src/components/remember/remember-experience.tsx \
            src/components/remember/remember-shell.tsx \
            src/components/remember/scenes/menu-scene.tsx \
            src/components/remember/scenes/pause-menu.tsx \
            src/components/remember/state/remember-reducer.ts
          git diff --no-color -- \
            package.json \
            src/app/remember/remember-game.css \
            src/components/remember/archive/archive-policy.ts \
            src/components/remember/archive/archive-policy.test.mjs \
            src/components/remember/archive/memory-archive.tsx \
            src/components/remember/audio/use-remember-audio.ts \
            src/components/remember/content/remember-locales.ts \
            src/components/remember/remember-experience.tsx \
            src/components/remember/remember-shell.tsx \
            src/components/remember/scenes/menu-scene.tsx \
            src/components/remember/scenes/pause-menu.tsx \
            src/components/remember/state/remember-reducer.ts
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
