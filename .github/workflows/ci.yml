name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format bestiary component
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/bestiary-bosses-forbidden-records'
        run: |
          npx prettier --write src/components/experience/bestiary-bosses-chapter.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/experience/bestiary-bosses-chapter.tsx
            git commit -m "style: format bestiary bosses component"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
