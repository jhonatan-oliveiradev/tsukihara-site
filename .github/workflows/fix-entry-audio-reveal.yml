name: Fix entry audio reveal

on:
  push:
    branches:
      - feat/cinematic-entry-gateway

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinematic-entry-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Decouple reveal from audio promise
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/experience/immersive-experience.tsx')
          text = path.read_text()
          old = '''  const enter = async (withSound: boolean) => {
            const audio = audioRef.current;
            setGate("revealing");
            setMuted(!withSound);

            if (!audio) return;
            audio.volume = AUDIO_VOLUME;
            audio.muted = !withSound;
            try {
              await audio.play();
            } catch {
              audio.muted = true;
              setMuted(true);
            }
          };'''
          new = '''  const enter = (withSound: boolean) => {
            const audio = audioRef.current;
            setGate("revealing");
            setMuted(!withSound);

            if (!audio) return;
            audio.volume = AUDIO_VOLUME;
            audio.muted = !withSound;
            void audio.play().catch(() => {
              audio.muted = true;
              setMuted(true);
            });
          };'''
          if old not in text:
              raise SystemExit('target snippet not found')
          path.write_text(text.replace(old, new))
          PY
      - run: npx prettier --write src/components/experience/immersive-experience.tsx
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/immersive-experience.tsx
          git commit -m "fix: decouple cinematic reveal from audio playback"
          git push origin HEAD:feat/cinematic-entry-gateway
