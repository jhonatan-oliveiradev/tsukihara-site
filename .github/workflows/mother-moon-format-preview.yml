name: Mother Moon format preview

on:
  pull_request:

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format files
        run: |
          npx prettier --write docs/superpowers/plans/2026-08-23-mother-moon-eclipse-heir.md docs/superpowers/specs/2026-08-23-mother-moon-eclipse-heir-design.md src/app/mother-moon-chapter.css src/components/experience/bestiary-bosses-chapter.tsx src/components/experience/mother-moon/mother-moon-asset.tsx src/components/experience/mother-moon/mother-moon-memory-field.tsx src/content/mother-moon.ts
      - name: Collect formatted files
        run: |
          mkdir -p formatted/docs/superpowers/plans formatted/docs/superpowers/specs formatted/src/app formatted/src/components/experience/mother-moon formatted/src/components/experience
          cp docs/superpowers/plans/2026-08-23-mother-moon-eclipse-heir.md formatted/docs/superpowers/plans/
          cp docs/superpowers/specs/2026-08-23-mother-moon-eclipse-heir-design.md formatted/docs/superpowers/specs/
          cp src/app/mother-moon-chapter.css formatted/src/app/
          cp src/components/experience/bestiary-bosses-chapter.tsx formatted/src/components/experience/
          cp src/components/experience/mother-moon/mother-moon-asset.tsx formatted/src/components/experience/mother-moon/
          cp src/components/experience/mother-moon/mother-moon-memory-field.tsx formatted/src/components/experience/mother-moon/
          cp src/content/mother-moon.ts formatted/src/content-mother-moon.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: mother-moon-formatted-files
          path: formatted
