name: Mother Moon format finalize

on:
  push:
    branches:
      - feat/mother-moon-eclipse-heir

permissions:
  contents: write

jobs:
  format-finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mother-moon-eclipse-heir
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format affected files
        run: |
          npx prettier --write docs/superpowers/plans/2026-08-23-mother-moon-eclipse-heir.md docs/superpowers/specs/2026-08-23-mother-moon-eclipse-heir-design.md src/app/mother-moon-chapter.css src/components/experience/bestiary-bosses-chapter.tsx src/components/experience/mother-moon/mother-moon-asset.tsx src/components/experience/mother-moon/mother-moon-memory-field.tsx src/content/mother-moon.ts
          sed -i 's/inset-left: 37%;/left: 37%;/' src/app/mother-moon-chapter.css
          npx prettier --write src/app/mother-moon-chapter.css
      - name: Remove temporary workflow
        run: rm .github/workflows/mother-moon-format-preview.yml
      - name: Commit formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/plans/2026-08-23-mother-moon-eclipse-heir.md docs/superpowers/specs/2026-08-23-mother-moon-eclipse-heir-design.md src/app/mother-moon-chapter.css src/components/experience/bestiary-bosses-chapter.tsx src/components/experience/mother-moon/mother-moon-asset.tsx src/components/experience/mother-moon/mother-moon-memory-field.tsx src/content/mother-moon.ts .github/workflows/mother-moon-format-preview.yml
          git commit -m "chore: format mother moon chapter"
          git push origin HEAD:feat/mother-moon-eclipse-heir
