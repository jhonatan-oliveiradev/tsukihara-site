name: Format Akari chapter

on:
  push:
    branches:
      - feat/akari-editorial-chapter

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/akari-editorial-chapter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/app/akari-chapter.css src/components/experience/character-spotlight.tsx docs/superpowers/specs/2026-08-21-akari-editorial-chapter-design.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/akari-chapter.css src/components/experience/character-spotlight.tsx docs/superpowers/specs/2026-08-21-akari-editorial-chapter-design.md
          git commit -m "style: format Akari editorial chapter"
          git push
