name: Format entry gateway

on:
  push:
    branches:
      - feat/cinematic-entry-gateway

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cinematic-entry-gateway
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/app/entry-gateway.css src/components/experience/cinematic-preloader.tsx src/components/experience/immersive-experience.tsx src/app/layout.tsx .github/workflows/hero-runtime-smoke.yml
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/entry-gateway.css src/components/experience/cinematic-preloader.tsx src/components/experience/immersive-experience.tsx src/app/layout.tsx .github/workflows/hero-runtime-smoke.yml
          git commit -m "style: format cinematic entry gateway"
          git push origin HEAD:feat/cinematic-entry-gateway
