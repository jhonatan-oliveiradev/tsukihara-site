name: Temporary REMEMBER LP return fixer

on:
  push:
    branches:
      - feat/remember-lp-entry
    paths:
      - .github/workflows/remember-lp-return-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/remember-lp-entry

      - name: Route REMEMBER exit back to its LP gateway
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/remember/remember-experience.tsx")
          text = path.read_text()
          old = '    router.push("/");'
          new = '    router.push("/#remember");'
          assert text.count(old) == 1, "expected exactly one REMEMBER root exit"
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit return route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/remember/remember-experience.tsx
          git commit -m "fix: return REMEMBER exits to landing gateway"
          git push origin HEAD:feat/remember-lp-entry
