name: Mother Moon text motion format

on:
  push:
    branches:
      - feat/mother-moon-text-motion

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mother-moon-text-motion
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format text motion files
        run: |
          npx prettier --write src/components/experience/mother-moon-chapter.tsx src/components/experience/mother-moon/use-mother-moon-motion.ts
      - name: Remove temporary workflow
        run: rm .github/workflows/mother-moon-text-motion-format.yml
      - name: Commit formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/mother-moon-chapter.tsx src/components/experience/mother-moon/use-mother-moon-motion.ts .github/workflows/mother-moon-text-motion-format.yml
          git commit -m "chore: format Mother Moon text motion"
          git push origin HEAD:feat/mother-moon-text-motion
