name: Motion formatter probe

on:
  push:
    branches:
      - fix/cinematic-motion-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cinematic-motion-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/components/experience/world-canvas.tsx
      - name: Commit formatter output when needed
        run: |
          if git diff --quiet -- src/components/experience/world-canvas.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/experience/world-canvas.tsx
          git commit -m "style: format cinematic motion runtime"
          git push origin HEAD:fix/cinematic-motion-hardening
