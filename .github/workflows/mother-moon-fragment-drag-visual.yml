name: Mother Moon fragment drag QA

on:
  pull_request:
    branches:
      - main

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Start production server
        run: |
          npm run start -- -p 3000 > /tmp/tsukihara-mother-moon.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/tsukihara-mother-moon.log
          exit 1
      - name: Exercise Tsukino fragment interaction
        run: |
          mkdir -p qa/mother-moon-fragments
          cat > qa/mother-moon-fragments.cjs <<'NODE'
          const { chromium } = require("playwright");

          const SELECTORS = {
            gallery: "[data-mm-presence-gallery]",
            shell: "[data-mm-presence-detail]",
            layer: "[data-mm-fragment-drag]",
          };

          async function enter(page) {
            await page.goto("http://127.0.0.1:3000", { waitUntil: "domcontentloaded" });
            await page.waitForFunction(
              () => document.querySelector(".ix-entry-gateway")?.dataset.phase === "entry",
              null,
              { timeout: 45000 },
            );
            const buttons = page.locator(".ix-gateway-actions button");
            await buttons.nth(1).evaluate((button) => button.click());
            await page.waitForFunction(() => !document.querySelector(".ix-entry-gateway"), null, {
              timeout: 12000,
            });
            await page.waitForSelector(SELECTORS.gallery, { timeout: 10000 });
          }

          async function focusGallery(page) {
            await page.locator(SELECTORS.gallery).evaluate((gallery) => {
              const top = gallery.getBoundingClientRect().top + window.scrollY;
              window.scrollTo({ top: Math.max(0, top - window.innerHeight * 0.08), behavior: "instant" });
            });
            await page.waitForTimeout(1500);
          }

          async function fragmentState(page, index) {
            return page.locator(SELECTORS.shell).nth(index).evaluate((shell) => {
              const layer = shell.querySelector("[data-mm-fragment-drag]");
              const image = layer?.querySelector("img");
              const gallery = shell.closest("[data-mm-presence-gallery]");
              const shellRect = shell.getBoundingClientRect();
              const layerRect = layer?.getBoundingClientRect();
              const galleryRect = gallery?.getBoundingClientRect();
              const layerStyle = layer ? getComputedStyle(layer) : null;
              const imageStyle = image ? getComputedStyle(image) : null;

              return {
                shellRect: {
                  left: shellRect.left,
                  top: shellRect.top,
                  width: shellRect.width,
                  height: shellRect.height,
                },
                layerRect: layerRect
                  ? {
                      left: layerRect.left,
                      top: layerRect.top,
                      right: layerRect.right,
                      bottom: layerRect.bottom,
                      width: layerRect.width,
                      height: layerRect.height,
                    }
                  : null,
                galleryRect: galleryRect
                  ? {
                      left: galleryRect.left,
                      top: galleryRect.top,
                      right: galleryRect.right,
                      bottom: galleryRect.bottom,
                    }
                  : null,
                transform: layerStyle?.transform ?? null,
                cursor: layerStyle?.cursor ?? null,
                zIndex: getComputedStyle(shell).zIndex,
                dragging: layer?.classList.contains("is-dragging") ?? false,
                image: image
                  ? {
                      src: image.currentSrc || image.getAttribute("src"),
                      complete: image.complete,
                      naturalWidth: image.naturalWidth,
                      opacity: Number(imageStyle?.opacity ?? 1),
                      visibility: imageStyle?.visibility ?? null,
                      display: imageStyle?.display ?? null,
                    }
                  : null,
              };
            });
          }

          async function startFlickerProbe(page, index) {
            await page.locator(SELECTORS.shell).nth(index).evaluate((shell) => {
              const layer = shell.querySelector("[data-mm-fragment-drag]");
              const image = layer?.querySelector("img");
              window.__mmFragmentProbe = [];
              let frames = 0;

              const sample = () => {
                if (!image || !layer) return;
                const imageStyle = getComputedStyle(image);
                const rect = image.getBoundingClientRect();
                window.__mmFragmentProbe.push({
                  src: image.currentSrc || image.getAttribute("src"),
                  display: imageStyle.display,
                  visibility: imageStyle.visibility,
                  opacity: Number(imageStyle.opacity),
                  width: rect.width,
                  height: rect.height,
                });
                frames += 1;
                if (frames < 72) requestAnimationFrame(sample);
              };

              requestAnimationFrame(sample);
            });
          }

          async function readFlickerProbe(page) {
            return page.evaluate(() => window.__mmFragmentProbe ?? []);
          }

          async function dragLayer(page, index, deltaX, deltaY) {
            const layer = page.locator(SELECTORS.layer).nth(index);
            await layer.scrollIntoViewIfNeeded();
            await page.waitForTimeout(700);
            const box = await layer.boundingBox();
            if (!box) throw new Error(`fragment ${index} has no bounding box`);

            const startX = box.x + box.width * 0.5;
            const startY = box.y + box.height * 0.5;
            await page.mouse.move(startX, startY);
            await startFlickerProbe(page, index);
            await page.mouse.down();
            await page.waitForTimeout(80);

            const dragging = await fragmentState(page, index);
            if (!dragging.dragging) throw new Error(`fragment ${index} did not enter dragging state`);

            for (let step = 1; step <= 14; step += 1) {
              const progress = step / 14;
              await page.mouse.move(startX + deltaX * progress, startY + deltaY * progress);
              await page.waitForTimeout(18);
            }

            await page.waitForTimeout(120);
            const during = await fragmentState(page, index);
            await page.mouse.up();
            await page.waitForTimeout(850);
            const after = await fragmentState(page, index);
            const probe = await readFlickerProbe(page);

            return { dragging, during, after, probe };
          }

          function assertFlickerFree(result, label, errors) {
            const samples = result.probe;
            if (samples.length < 12) errors.push(`${label}: flicker probe captured too few frames`);
            const sources = new Set(samples.map((sample) => sample.src).filter(Boolean));
            if (sources.size > 1) errors.push(`${label}: image source changed during drag`);
            if (
              samples.some(
                (sample) =>
                  sample.display === "none" ||
                  sample.visibility === "hidden" ||
                  sample.opacity < 0.98 ||
                  sample.width < 1 ||
                  sample.height < 1,
              )
            ) {
              errors.push(`${label}: image became visually unavailable during a sampled frame`);
            }
          }

          function assertShellStable(before, after, label, errors) {
            for (const key of ["left", "top", "width", "height"]) {
              if (Math.abs(before.shellRect[key] - after.shellRect[key]) > 0.75) {
                errors.push(`${label}: reveal shell geometry shifted at ${key}`);
              }
            }
          }

          function assertVisibleBounds(state, label, errors) {
            if (!state.layerRect || !state.galleryRect) {
              errors.push(`${label}: missing bounds geometry`);
              return;
            }

            const visibleWidth = Math.max(
              0,
              Math.min(state.layerRect.right, state.galleryRect.right) -
                Math.max(state.layerRect.left, state.galleryRect.left),
            );
            const visibleHeight = Math.max(
              0,
              Math.min(state.layerRect.bottom, state.galleryRect.bottom) -
                Math.max(state.layerRect.top, state.galleryRect.top),
            );

            if (visibleWidth < 70 || visibleHeight < 70) {
              errors.push(`${label}: fragment escaped scene bounds (${visibleWidth}x${visibleHeight})`);
            }
          }

          async function runFinePointerCase(browser, width, height, label, testAll = false) {
            const page = await browser.newPage({ viewport: { width, height } });
            const errors = [];
            page.on("pageerror", (error) => errors.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") errors.push(`console: ${message.text()}`);
            });

            await enter(page);
            await focusGallery(page);
            const media = await page.evaluate(() => ({
              fine: matchMedia("(pointer: fine)").matches,
              reduced: matchMedia("(prefers-reduced-motion: reduce)").matches,
            }));
            if (!media.fine) errors.push(`${label}: expected fine pointer`);

            const layers = page.locator(SELECTORS.layer);
            if ((await layers.count()) !== 4) errors.push(`${label}: expected four drag layers`);

            const indexes = testAll ? [0, 1, 2, 3] : [0];
            for (const index of indexes) {
              const before = await fragmentState(page, index);
              if (before.cursor !== "grab") errors.push(`${label}/${index}: cursor is ${before.cursor}`);
              if (!before.image?.complete || !before.image.naturalWidth) {
                errors.push(`${label}/${index}: image is not fully loaded before drag`);
              }

              const deltaX = index === 3 ? Math.min(520, width * 0.38) : 110 + index * 24;
              const deltaY = index === 3 ? Math.min(330, height * 0.36) : 58 + index * 18;
              const result = await dragLayer(page, index, deltaX, deltaY);

              if (result.during.transform === before.transform) {
                errors.push(`${label}/${index}: transform did not change while dragging`);
              }
              if (Number(result.after.zIndex) <= Number(before.zIndex)) {
                errors.push(`${label}/${index}: manipulated fragment did not rise in z-order`);
              }
              if (result.after.image?.src !== before.image?.src) {
                errors.push(`${label}/${index}: image src changed after drop`);
              }
              assertShellStable(before, result.after, `${label}/${index}`, errors);
              assertVisibleBounds(result.after, `${label}/${index}`, errors);
              assertFlickerFree(result, `${label}/${index}`, errors);
            }

            const overflow = await page.evaluate(
              () => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
            );
            if (overflow) errors.push(`${label}: horizontal overflow after drag`);

            const scrollBefore = await page.evaluate(() => window.scrollY);
            await page.mouse.wheel(0, 420);
            await page.waitForTimeout(550);
            const scrollAfter = await page.evaluate(() => window.scrollY);
            if (scrollAfter <= scrollBefore + 40) errors.push(`${label}: page did not scroll after drag`);

            await page.locator(SELECTORS.gallery).screenshot({
              path: `qa/mother-moon-fragments/${label}.png`,
            });
            console.log(label, { media, scrollBefore, scrollAfter, errors });
            if (errors.length) throw new Error(errors.join("\n"));
            await page.close();
          }

          async function runReducedMotionCase(browser) {
            const page = await browser.newPage({
              viewport: { width: 1440, height: 900 },
              reducedMotion: "reduce",
            });
            const errors = [];
            page.on("pageerror", (error) => errors.push(`pageerror: ${error.message}`));
            await enter(page);
            await focusGallery(page);

            const before = await fragmentState(page, 0);
            const result = await dragLayer(page, 0, 140, 70);
            if (result.after.transform === before.transform) {
              errors.push("reduced: direct drag did not reposition fragment");
            }
            const motionState = await page.locator(SELECTORS.layer).nth(0).evaluate((layer) => ({
              transitionDuration: getComputedStyle(layer).transitionDuration,
              matrix: getComputedStyle(layer).transform,
            }));
            if (motionState.transitionDuration !== "0s") {
              errors.push(`reduced: transition remains ${motionState.transitionDuration}`);
            }
            assertFlickerFree(result, "reduced", errors);
            assertShellStable(before, result.after, "reduced", errors);
            assertVisibleBounds(result.after, "reduced", errors);

            await page.locator(SELECTORS.gallery).screenshot({
              path: "qa/mother-moon-fragments/reduced-motion.png",
            });
            console.log("reduced-motion", { motionState, errors });
            if (errors.length) throw new Error(errors.join("\n"));
            await page.close();
          }

          async function runCoarsePointerCase(browser, width, height, label, isMobile) {
            const context = await browser.newContext({
              viewport: { width, height },
              hasTouch: true,
              isMobile,
            });
            const page = await context.newPage();
            const errors = [];
            page.on("pageerror", (error) => errors.push(`pageerror: ${error.message}`));
            page.on("console", (message) => {
              if (message.type() === "error") errors.push(`console: ${message.text()}`);
            });

            await enter(page);
            await focusGallery(page);
            const media = await page.evaluate(() => ({
              fine: matchMedia("(pointer: fine)").matches,
              coarse: matchMedia("(pointer: coarse)").matches,
            }));
            if (media.fine || !media.coarse) errors.push(`${label}: expected coarse-only pointer`);

            const beforeTransform = await page.locator(SELECTORS.layer).nth(0).evaluate((layer) =>
              getComputedStyle(layer).transform,
            );
            const galleryBox = await page.locator(SELECTORS.gallery).boundingBox();
            if (!galleryBox) throw new Error(`${label}: missing gallery box`);

            const client = await context.newCDPSession(page);
            const x = Math.min(width - 30, Math.max(30, galleryBox.x + galleryBox.width * 0.5));
            const startY = Math.min(height - 80, Math.max(180, galleryBox.y + 260));
            const scrollBefore = await page.evaluate(() => window.scrollY);
            await client.send("Input.dispatchTouchEvent", {
              type: "touchStart",
              touchPoints: [{ x, y: startY }],
            });
            for (let step = 1; step <= 10; step += 1) {
              await client.send("Input.dispatchTouchEvent", {
                type: "touchMove",
                touchPoints: [{ x, y: startY - step * 26 }],
              });
              await page.waitForTimeout(18);
            }
            await client.send("Input.dispatchTouchEvent", { type: "touchEnd", touchPoints: [] });
            await page.waitForTimeout(650);

            const scrollAfter = await page.evaluate(() => window.scrollY);
            const afterTransform = await page.locator(SELECTORS.layer).nth(0).evaluate((layer) =>
              getComputedStyle(layer).transform,
            );
            if (scrollAfter <= scrollBefore + 40) errors.push(`${label}: touch gesture did not scroll page`);
            if (afterTransform !== beforeTransform) {
              errors.push(`${label}: coarse-pointer gesture moved a fragment`);
            }

            const cards = await page.locator(SELECTORS.shell).evaluateAll((shells) =>
              shells.map((shell) => {
                const rect = shell.getBoundingClientRect();
                return { width: rect.width, height: rect.height, position: getComputedStyle(shell).position };
              }),
            );
            if (cards.some((card) => card.width < 180 || card.height < 180)) {
              errors.push(`${label}: fragment cards became too small`);
            }

            await page.locator(SELECTORS.gallery).screenshot({
              path: `qa/mother-moon-fragments/${label}.png`,
            });
            console.log(label, { media, scrollBefore, scrollAfter, cards, errors });
            if (errors.length) throw new Error(errors.join("\n"));
            await context.close();
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            await runFinePointerCase(browser, 1536, 864, "desktop-1536", true);
            await runFinePointerCase(browser, 1440, 900, "desktop-1440");
            await runFinePointerCase(browser, 1366, 768, "desktop-1366");
            await runFinePointerCase(browser, 1024, 768, "desktop-1024");
            await runReducedMotionCase(browser);
            await runCoarsePointerCase(browser, 1024, 768, "tablet-touch-1024", false);
            await runCoarsePointerCase(browser, 390, 844, "mobile-390", true);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node qa/mother-moon-fragments.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mother-moon-fragment-drag-visual
          path: qa/mother-moon-fragments
