name: Despill hero characters

on:
  push:
    branches:
      - feat/hero-cinematic-parallax

permissions:
  contents: write

jobs:
  despill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hero-cinematic-parallax
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create web-safe character derivative
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          source = Path('public/parallax/tsukihara-characters.png')
          target = Path('public/parallax/tsukihara-characters-web.png')

          image = Image.open(source).convert('RGBA')
          r, g, b, a = image.split()

          binary = a.point(lambda value: 255 if value > 0 else 0)
          interior = binary.filter(ImageFilter.MinFilter(11))
          border = Image.eval(interior, lambda value: 255 - value)

          pixels = image.load()
          border_pixels = border.load()
          changed = 0

          for y in range(image.height):
              for x in range(image.width):
                  if border_pixels[x, y] == 0:
                      continue
                  red, green, blue, alpha = pixels[x, y]
                  if alpha == 0:
                      continue

                  dominant = max(red, blue)
                  if green > dominant + 16 and green > red * 1.08 and green > blue * 1.06:
                      excess = green - dominant
                      new_green = min(255, int(dominant * 1.02))
                      new_red = min(255, int(red + excess * 0.14))
                      new_blue = min(255, int(blue + excess * 0.06))
                      pixels[x, y] = (new_red, new_green, new_blue, alpha)
                      changed += 1

          image.save(target, optimize=True)
          print(f'Created {target} with {changed} edge pixels despilled; alpha preserved.')
          PY
      - name: Commit derivative
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/parallax/tsukihara-characters-web.png
          if git diff --cached --quiet; then
            echo "No derivative changes to commit."
            exit 0
          fi
          git commit -m "fix: despill hero character edges"
          git push origin HEAD:feat/hero-cinematic-parallax
