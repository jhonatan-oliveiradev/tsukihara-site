name: Format Nine Realms implementation

on:
  push:
    branches:
      - feat/nine-realms-world-map

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nine-realms-world-map
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/app/nine-realms-world.css src/components/experience/nine-realms-map.tsx src/components/experience/realm-atlas.tsx src/content/realm-world.ts
      - name: Commit formatted files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/nine-realms-world.css src/components/experience/nine-realms-map.tsx src/components/experience/realm-atlas.tsx src/content/realm-world.ts
          git commit -m "style: format Nine Realms implementation"
          git push origin HEAD:feat/nine-realms-world-map
