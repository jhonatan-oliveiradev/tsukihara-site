name: Format memory bridge

on:
  push:
    branches:
      - feat/memory-bridge-transition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/memory-bridge-transition
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prettier --write src/app/memory-bridge.css src/components/experience/hero/hooks/use-memory-bridge.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/memory-bridge.css src/components/experience/hero/hooks/use-memory-bridge.ts
          git commit -m "style: format memory bridge"
          git push origin HEAD:feat/memory-bridge-transition
